independent:
  intro: Personal work, built and run on my own infrastructure. Where I keep my hands in the actual engineering.
  items:
    - "Self-hosted platform: Docker on my NAS running the MCP server, the search engine, four ingest pipelines and scheduled jobs, behind TLS and auth, with secrets in 1Password. The same NAS runs central logs and metrics for my home network and home automation (Vector, VictoriaLogs, InfluxDB, Grafana). From May to July 2026 it also hosted a Telegram chat agent, which I switched off when I found I was barely using it. I own all of it: Docker, networking, security, reliability."
    - "Custom MCP server (access to my digital brain): an MCP server I wrote that exposes 20+ tools over my knowledge base (hybrid search that blends meaning and keywords with a re-ranker, reading and writing notes, task capture, note clean-up checks, and loading the right context at the start of each agent session), reachable over a Cloudflare tunnel and used daily by several agents and web LLM connectors. The search engine is my own tuned fork of an open-source Markdown notes server."
    - "Autonomous daily intelligence brief: an agent that ingests across four dedicated pipelines (video transcripts, social posts, newsletters, news feeds) plus other LLM passes, then tiers sources, detects convergence, gates on freshness, and routes work across cheaper and stronger models to keep cost sane. Effectively a small one-person AI product providing intelligent news gathering."
    - "Multi-agent reasoning pipelines: parallel reconnaissance agents for research, and a gated strategy pipeline that runs an adversarial critic against a hypothesis and labels each claim with a confidence level."
    - "Unattended overnight agent runs: a harness that works through a queue of tasks while I sleep. It keeps a durable task ledger, pauses when a subscription usage limit is hit and resumes after it resets, and uses Codex as a worker with Claude checking each result. It runs on flat-rate subscriptions only, with zero metered API spend. Its runs have produced, among others, a 16-part research study on on-device search."
    - "Model routing, and what measuring it taught me: I built a harness to send each task to the cheapest model that could do it and to hand coding work to Codex, with 394 tests. A month of my own use, 49,603 turns, showed it had not changed a single dispatch: the usage gate never came near firing and the cheap-model path was never switched on. The same audit, judged blind by a second model, found the biggest model oversized on many small tasks and worth its cost on the token-heavy ones."
    - "Model fine-tuning, a learning track: one QLoRA run with axolotl on my RTX 4070 (a 360M-parameter model, a small hand-made dataset, through training to inference) to learn how the loop works. Next I want to train a small plain-language rewriter for my own writing on a Mac with MLX. The test set, checks and baseline are ready; the training run is still ahead."
    - "Personal agent tooling: about 30 skills and 14 agents in five plugins, separate from the work toolkit, that run from Claude Code, Codex and Grok. Usage telemetry shows what gets used, a blind trigger test reruns whenever a skill's description changes, and a review backlog tells me what to fix next. Before I act on a plan, a second model reviews it (Codex, plus Grok for big decisions)."

